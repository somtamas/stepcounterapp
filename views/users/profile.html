<h3>My profile</h3>
<hr>

<div class="row">
    <div class="col-lg-6">
        <h6><i class="bi bi-key"></i>&nbsp;&nbsp;Update profile</h6>

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="name" placeholder="">
            <label for="name">Username</label>
        </div>

        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="">
            <label for="email">Email address</label>
        </div>

        <button type="button" class="btn btn-primary mb-3"><i class="bi bi-arrow-repeat"></i>&nbsp;&nbsp;Update profile</button>
    
    </div>
    <div class="col-lg-6">
        <h6><i class="bi bi-key"></i>&nbsp;&nbsp;Update password</h6>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="oldpassword" placeholder="">
            <label for="oldpassword">Old password</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="newpassword" placeholder="">
            <label for="newpassword">New password</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="confirm" placeholder="">
            <label for="confirm">Confirm password</label>
        </div>

        <button type="button" class="btn btn-primary mb-3"><i class="bi bi-arrow-repeat"></i>&nbsp;&nbsp;Update profile</button>
    
    </div>
</div>
